name: Live smoke tests

# Against the real Open-Meteo and NASA EONET, so only on demand: the regular CI never depends on third-party uptime.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --target build --tag aggregator-build --progress=plain .

      - name: Live smoke tests
        run: docker run --rm -e AGGREGATOR_LIVE_TESTS=1 aggregator-build dotnet tests/Aggregator.LiveTests/bin/Release/net10.0/Aggregator.LiveTests.dll
